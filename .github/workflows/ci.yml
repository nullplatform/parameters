name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Scripts are extensionless (parameters/entrypoint, utils/*, providers/*/*),
      # so the shared reusable's old `find -name '*.sh'` matched nothing here.
      # actions-nullplatform#81 teaches the reusable to discover extensionless
      # scripts by shebang; once it merges, replace this job with:
      #   uses: nullplatform/actions-nullplatform/.github/workflows/shellcheck.yml@main
      - name: Run ShellCheck
        run: |
          find parameters -type f \( ! -name '*.*' -o -name '*.sh' \) \
            -not -path '*/.git/*' -not -path '*/.terraform/*' -print0 \
            | xargs -0 grep -lE '^#!.*sh' \
            | xargs -r shellcheck --severity=error --shell=bash -x

  trivy-iac:
    name: Trivy IaC Scan
    permissions:
      contents: read
      security-events: write
    uses: nullplatform/actions-nullplatform/.github/workflows/trivy-tofu-scan.yml@main

  tofu:
    name: Tofu Lint & Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: v1.10.6

      - name: tofu fmt
        run: tofu fmt -check -recursive parameters/providers

      # Multi-module repo: one tofu module per provider spec, so init/validate
      # per discovered module rather than at the repo root. Discovery is dynamic,
      # so new providers are covered automatically once committed.
      - name: tofu init + validate (per module)
        run: |
          set -e
          modules=$(find parameters/providers -name versions.tf \
            -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          for m in $modules; do
            echo "::group::$m"
            ( cd "$m" && tofu init -backend=false -input=false >/dev/null && tofu validate -no-color )
            echo "::endgroup::"
          done

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq

      - name: Install gomplate
        run: |
          sudo curl -fsSL -o /usr/local/bin/gomplate \
            https://github.com/hairyhenderson/gomplate/releases/download/v4.3.3/gomplate_linux-amd64
          sudo chmod +x /usr/local/bin/gomplate
          gomplate --version

      - name: Run unit tests
        run: make test-unit
