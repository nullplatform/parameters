name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Scripts are extensionless (parameters/entrypoint, utils/*, providers/*/*),
      # so the shared reusable's `find -name '*.sh'` matches nothing here. Discover
      # by shell shebang instead, skipping .bats/.tf/.md and generated .terraform dirs.
      - name: Run ShellCheck
        run: |
          find parameters -type f \( ! -name '*.*' -o -name '*.sh' \) \
            -not -path '*/.git/*' -not -path '*/.terraform/*' -print0 \
            | xargs -0 grep -lE '^#!.*sh' \
            | xargs -r shellcheck --severity=error --shell=bash -x

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq

      - name: Install gomplate
        run: |
          sudo curl -fsSL -o /usr/local/bin/gomplate \
            https://github.com/hairyhenderson/gomplate/releases/download/v4.3.3/gomplate_linux-amd64
          sudo chmod +x /usr/local/bin/gomplate
          gomplate --version

      - name: Run unit tests
        run: make test-unit
